name: Build

on:
  push:
    branches: [main, macos, linux, linux-phase2, 'fix-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app and installer
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSnap-Windows
          path: |
            windows/bin/MiniSnap-Setup.exe
            windows/bin/MiniSnap.exe

  macos:
    runs-on: macos-26
    env:
      # The fixed signing certificate (repository secrets MACOS_CERT_P12 = base64 .p12, MACOS_CERT_PASSWORD).
      # Without it (e.g. pull requests from forks) the app gets an ad-hoc signature.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for macOS sources
        id: src
        shell: bash
        run: |
          if [ -f macos/build.sh ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No macOS sources yet - skipping."; fi
      - name: Releases must be signed with the fixed certificate
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_CERT != 'true'
        run: |
          echo "::error::Add the MACOS_CERT_P12 and MACOS_CERT_PASSWORD repository secrets: an ad-hoc signed release would make macOS ask for the Screen Recording permission again."
          exit 1
      - name: Import the code signing certificate
        if: steps.src.outputs.present == 'true' && env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # A self-signed certificate must be trusted for code signing before codesign accepts it.
          security find-certificate -c "MiniSnap Code Signing (nnqbao)" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" \
            || echo "::warning::Could not mark the signing certificate as trusted"
          echo "::notice title=signing identities::$(security find-identity -p codesigning "$KC" | tr '\n' ' ')"
          echo "MACOS_SIGN_IDENTITY=MiniSnap Code Signing (nnqbao)" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build MiniSnap.app
        if: steps.src.outputs.present == 'true'
        run: bash macos/build.sh
      - name: Check the signature
        if: steps.src.outputs.present == 'true'
        run: |
          INFO="$(codesign --display --verbose=2 macos/dist/MiniSnap.app 2>&1 | grep -E '^(Identifier|Authority|Signature)=' || true)"
          REQ="$(codesign --display --requirements - macos/dist/MiniSnap.app 2>&1 | grep 'designated' || true)"
          echo "$INFO"; echo "$REQ"
          echo "::notice title=signature::$(printf '%s' "$INFO" | tr '\n' ' ') | $REQ"
          if [ "$HAS_CERT" = "true" ]; then
            # The designated requirement must pin the certificate (not a per-build hash, as an ad-hoc one does).
            printf '%s' "$INFO" | grep -q 'Authority=MiniSnap Code Signing (nnqbao)'
            printf '%s' "$REQ" | grep -Eq 'certificate (leaf|root)'
          fi
      - name: Render the blur settings grid
        if: steps.src.outputs.present == 'true'
        run: |
          mkdir -p macos-selftest
          macos/dist/MiniSnap.app/Contents/MacOS/MiniSnap --blur-grid "$PWD/macos-selftest/blur-grid.png"
          test -s macos-selftest/blur-grid.png
      - name: Report the editor toolbar layout
        if: steps.src.outputs.present == 'true'
        run: |
          REPORT="$(macos/dist/MiniSnap.app/Contents/MacOS/MiniSnap --editor-layout)"
          echo "$REPORT"
          echo "::notice title=editor layout::$REPORT"
          # The tool buttons must sit below the title bar with room above them, not touch it.
          python3 - "$REPORT" <<'EOF'
          import re, sys
          r = sys.argv[1]
          top = float(re.search(r"contentLayoutRect top=([\d.]+)", r).group(1))
          bar = [float(v) for v in re.search(r"toolsBar y=([\d.]+)\.\.([\d.]+)", r).groups()]
          btn = [float(v) for v in re.search(r"selectButton y=([\d.]+)\.\.([\d.]+)", r).groups()]
          above, below = btn[0] - bar[0], bar[1] - btn[1]
          print("space above %.1f, below %.1f" % (above, below))
          sys.exit(0 if bar[0] >= top and above >= 6 and abs(above - below) <= 2 else 1)
          EOF
      - name: Render the launcher and keyboard shortcuts windows
        if: steps.src.outputs.present == 'true'
        run: |
          macos/dist/MiniSnap.app/Contents/MacOS/MiniSnap --render-windows "$PWD/macos-selftest"
          for f in launcher-vi launcher-en hotkeys-vi hotkeys-en; do test -s "macos-selftest/$f.png"; done
      - uses: actions/upload-artifact@v4
        if: always() && steps.src.outputs.present == 'true'
        with:
          name: MiniSnap-macOS-selftest
          path: macos-selftest
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.present == 'true'
        with:
          name: MiniSnap-macOS
          path: macos/dist/MiniSnap-macOS.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for Linux sources
        id: src
        shell: bash
        run: |
          if [ -f linux/minisnap/__init__.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Linux sources yet - skipping."; fi
      - name: Install GTK4, libadwaita, GStreamer, Tesseract
        if: steps.src.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-pipewire \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng \
            appstream desktop-file-utils xvfb xauth dbus-x11 at-spi2-core fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji adwaita-icon-theme librsvg2-common
      - name: Syntax check
        if: steps.src.outputs.present == 'true'
        run: python3 -m compileall -q linux/minisnap
      - name: Validate AppStream metadata and desktop file (Flathub requirements)
        if: steps.src.outputs.present == 'true'
        run: |
          appstreamcli validate --no-net --explain linux/data/io.github.nnqbao.MiniSnap.metainfo.xml
          desktop-file-validate linux/data/io.github.nnqbao.MiniSnap.desktop
      - name: Self-test under Xvfb (renders every window to PNG)
        if: steps.src.outputs.present == 'true'
        working-directory: linux
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 -m minisnap --selftest "$GITHUB_WORKSPACE/selftest-linux"
      - uses: actions/upload-artifact@v4
        if: always() && steps.src.outputs.present == 'true'
        with:
          name: MiniSnap-Linux-selftest
          path: selftest-linux
      - name: Build .deb
        if: steps.src.outputs.present == 'true'
        run: bash linux/packaging/build-deb.sh
      - name: Install the .deb (checks its dependencies)
        if: steps.src.outputs.present == 'true'
        run: sudo apt-get install -y ./linux/dist/*.deb && test -x /usr/bin/minisnap
      - name: Flathub manifest generator works
        if: steps.src.outputs.present == 'true'
        run: |
          bash linux/packaging/make-flathub-manifest.sh HEAD /tmp/flathub.yml
          grep -q 'type: git' /tmp/flathub.yml && grep -q 'linux/bin/minisnap' /tmp/flathub.yml && ! grep -q 'type: dir' /tmp/flathub.yml
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.present == 'true'
        with:
          name: MiniSnap-Linux
          path: linux/dist/*.deb

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check for Linux sources
        id: src
        shell: bash
        run: |
          if [ -f linux/packaging/io.github.nnqbao.MiniSnap.yml ] && [ -f linux/minisnap/__init__.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: steps.src.outputs.present == 'true'
        with:
          bundle: MiniSnap.flatpak
          manifest-path: linux/packaging/io.github.nnqbao.MiniSnap.yml
          cache-key: flatpak-builder-${{ hashFiles('linux/packaging/io.github.nnqbao.MiniSnap.yml') }}

  # Pushing a tag such as v1.5.0 publishes a GitHub Release with the downloads that were built.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flathub manifest for this tag
        run: bash linux/packaging/make-flathub-manifest.sh "${{ github.ref_name }}" dist/io.github.nnqbao.MiniSnap.yml
      - name: Release notes from the AppStream metadata
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > dist/release-notes.md <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("linux/data/io.github.nnqbao.MiniSnap.metainfo.xml").getroot()
          for rel in root.iter("release"):
              if rel.get("version") == sys.argv[1]:
                  for p in rel.iter("p"):
                      print(" ".join((p.text or "").split()))
                      print()
          EOF
          cat dist/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/MiniSnap-Windows/MiniSnap-Setup.exe
            dist/MiniSnap-macOS/MiniSnap-macOS.zip
            dist/MiniSnap-Linux/*.deb
            dist/MiniSnap-x86_64.flatpak/*.flatpak
            dist/io.github.nnqbao.MiniSnap.yml
